name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_helpdesk
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smart_helpdesk
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
      GEMINI_API_KEY: ci-only-placeholder-key
      AI_USE_FAQ: "false"
      ALLOW_DESTRUCTIVE_SEED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
